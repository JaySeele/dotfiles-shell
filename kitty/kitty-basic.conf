shell_integration enabled
startup_session none

# 依然推荐保留 shell 集成，因为它能让 Kitty 更强大（例如跳转到上一个提示符）

mouse_hide_wait                              1.0

# 输入延迟：默认 3 帧（60Hz 下约 50ms）先攒起来再一起交给程序，TUI（yazi/lazygit 等）
# 里会感觉「按下去过一会儿才动」。0 = 收到就转发；万一滚动出现撕裂感再改回 1 试试
input_delay                                  0


# 用系统快捷键关闭窗口时不再提醒
confirm_os_window_close                      0
# 关闭窗口时同时关闭子进程
close_on_child_death                         yes

# 窗口样式
# 窗口边框  titlebar-only=藏标题栏(无红绿灯)但保留圆角 / titlebar-and-corners=连圆角一起去掉 / yes=全藏 / no=不藏
# hide_window_decorations                    titlebar-only\titlebar-and-corners\yes\no
hide_window_decorations                      titlebar-only
# 全屏用传统模式（不新建 Space），否则原生全屏背后是黑底，背景透明度会失效
macos_traditional_fullscreen                 yes
remember_window_size                         yes
# 位置记忆：存在 ~/Library/Caches/kitty/main.json 的 window-pos 里（不写这行 macOS 会把窗口扔到左上角）
# 窗口边距
window_padding_width                         0 10 0 10
# 开启垂直方向分屏和全屏模式
enabled_layouts                              fat:bias=50,tall:bias=50,stack

# 背景
background_blur                              0
# 背景透明度
background_opacity                           0
# background_opacity                           0.75

# 光标颜色使用当前文本颜色
cursor                                       none
cursor_trail                                 1
# 当移动1个字符位置时也使用动效，这样看着更平滑
cursor_trail_decay                           0.1 0.4
cursor_trail_start_threshold                 0
cursor_blink_interval                        0.5 ease-in-out

# ########### bar tab ###########

# Tab bar 样式  fade | slant | separator | powerline | custom | hidden
# custom = 由 ~/.config/kitty/tab_bar.py 的 draw_tab() 自己画（当前：Catppuccin 浮动胶囊）
# 改完 tab_bar.py 要 cmd+r 连按两次才生效（0.50 的缓存清理顺序问题）
tab_bar_style                                custom

# 下面两项只在 powerline / separator / fade 风格下生效，custom 下无效，留作切回时的参考
# tab_powerline_style                        slanted
# tab_separator                              ">>>"
# tab_fade                                   0.5 1

# Tab bar 位置
tab_bar_edge                                 top
# 标签标题模板（custom 下 draw_tab() 也会用它取文字）
tab_title_template                           "{title}"
active_tab_title_template                    "{title}"
# 活动 / 非活动标签的字体样式
active_tab_font_style                        bold
inactive_tab_font_style                      normal
# 标签栏边距：左右 6pt + 上方 4pt（悬浮感，纯 custom 渲染时才看得出差别）
tab_bar_margin_width                         6.0
tab_bar_margin_height                        4.0 0.0
# 边距颜色必须跟 tab_bar_background 一致（主题里是 #11111B），否则会出现一圈另一种灰
tab_bar_margin_color                         #11111B
